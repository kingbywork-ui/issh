[package]
name = "issh-tauri"
version = "0.1.6"
description = "Native issh desktop client"
authors = ["issh Developers"]
edition = "2021"

[lib]
name = "issh_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9"
sha2 = "0.11.0"
tauri = { version = "2.11.5", features = ["protocol-asset"] }
tokio = { version = "1.53.1", features = ["io-util", "net", "sync", "time"] }
issh-runtime-vault = { path = "../../issh-runtime/crates/vault" }
base64 = "0.22"
flate2 = "1.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tar = "0.4"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
rand = "0.8"
url = "2"
zeroize = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
