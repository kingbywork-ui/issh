[workspace]
members = [
    "crates/protocol",
    "crates/workspace",
    "crates/isshd",
]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tokio = { version = "1.47", features = ["io-util", "macros", "net", "rt-multi-thread"] }
