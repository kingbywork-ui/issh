[package]
name = "issh-runtime-vault"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aes-gcm = "0.10"
cbc = { version = "0.1", features = ["std"] }
aes = "0.8"
pbkdf2 = { version = "0.12", features = ["simple"] }
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
serde = { workspace = true }
serde_json = { workspace = true }
base64 = "0.22"
hex = "0.4"
thiserror = "2"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
