name: Docs
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'dependabot[bot]' }}

    steps:
    - name: Checkout
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        fetch-depth: 0

    - name: Installing Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 22

    - name: Build
      run: |
        sudo apt update && sudo apt install libfontconfig1-dev
        yarn cache clean
        cd app
        yarn
        cd ..
        rm app/node_modules/.yarn-integrity
        yarn
        yarn run build:typings
        yarn run docs

      env:
        DOCS_PRIVATE_KEY: ${{ secrets.DOCS_PRIVATE_KEY }}

    - uses: FirebaseExtended/action-hosting-deploy@e2eda2e106cfa35cdbcf4ac9ddaf6c4756df2c8c # v0
      with:
        repoToken: '${{ secrets.GITHUB_TOKEN }}'
        firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_TABBY_DOCS }}'
        channelId: live
        projectId: tabby-docs
