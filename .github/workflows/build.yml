name: Build release packages

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - dev

permissions:
  contents: read

concurrency:
  group: release-packages-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  YARN_VERSION: '1.22.22'

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache Yarn packages
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/yarn
          key: linux-x64-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: linux-x64-yarn-

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libsecret-1-dev

      - name: Install dependencies
        run: |
          npm install --global yarn@${YARN_VERSION}
          yarn --frozen-lockfile --ignore-scripts --network-timeout 1000000
          for package in issh-core issh-settings issh-terminal issh-community-color-schemes issh-ssh issh-local issh-linkifier issh-auto-sudo-password issh-llm; do
            yarn --cwd "$package" --pure-lockfile --ignore-scripts --network-timeout 1000000
          done
          yarn patch-package
          yarn --cwd issh-terminal patch-package

      - name: Type-check built-in plugins
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process'
          import { builtinPlugins } from './scripts/vars.mjs'
          for (const plugin of builtinPlugins) {
            const result = spawnSync('npx', ['tsc', '-p', `${plugin}/tsconfig.json`, '--noEmit'], { stdio: 'inherit' })
            if (result.status !== 0) process.exit(result.status ?? 1)
          }
          NODE

      - name: Run repository checks
        run: |
          yarn run lint
          yarn run test:issh-agent
          yarn run test:codex-desktop-config
          yarn run test:environment-compat
          yarn run test:migrations
          yarn run audit:security
          node scripts/test-webpack-mode.mjs

      - name: Full build
        run: yarn run build
