name: Build release packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-packages-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  YARN_VERSION: '1.22.22'

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      version: ${{ steps.app-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Read application version
        id: app-version
        run: echo "version=$(node -p "require('./app/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache Yarn packages
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/yarn
          key: linux-x64-yarn-${{ hashFiles('yarn.lock', 'app/yarn.lock') }}
          restore-keys: linux-x64-yarn-

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libsecret-1-dev

      - name: Install dependencies
        run: |
          npm install --global yarn@${YARN_VERSION}
          yarn --frozen-lockfile --ignore-scripts --network-timeout 1000000
          yarn --cwd app --frozen-lockfile --ignore-scripts --network-timeout 1000000
          for package in issh-core issh-settings issh-terminal issh-community-color-schemes issh-ssh issh-local issh-electron issh-linkifier issh-auto-sudo-password issh-llm; do
            yarn --cwd "$package" --pure-lockfile --ignore-scripts --network-timeout 1000000
          done
          yarn patch-package
          yarn --cwd app patch-package
          yarn --cwd issh-terminal patch-package

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          expected="v$(node -p "require('./app/package.json').version")"
          if [[ "${GITHUB_REF_NAME}" != "${expected}" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} must match app/package.json (${expected})." >&2
            exit 1
          fi

      - name: Type-check built-in plugins
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process'
          import { builtinPlugins } from './scripts/vars.mjs'
          for (const plugin of builtinPlugins) {
            const result = spawnSync('npx', ['tsc', '-p', `${plugin}/tsconfig.json`, '--noEmit'], { stdio: 'inherit' })
            if (result.status !== 0) process.exit(result.status ?? 1)
          }
          NODE

      - name: Type-check Electron app
        run: |
          npx tsc -p app/tsconfig.main.json --noEmit
          npx tsc -p app/tsconfig.json --noEmit

      - name: Run repository checks
        run: |
          yarn run lint
          yarn run test:issh-agent
          yarn run test:codex-desktop-config
          yarn run test:environment-compat
          yarn run test:migrations
          yarn run audit:security
          node scripts/test-webpack-mode.mjs

      - name: Full build
        run: yarn run build

  windows:
    name: Windows ${{ matrix.arch }}
    needs: preflight
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            rust-target: x86_64-pc-windows-msvc
            vc-redist: https://aka.ms/vs/17/release/vc_redist.x64.exe
            pe-machine: '8664'
          - arch: arm64
            rust-target: aarch64-pc-windows-msvc
            vc-redist: https://aka.ms/vs/17/release/vc_redist.arm64.exe
            pe-machine: 'AA64'
    env:
      ARCH: ${{ matrix.arch }}
      ISSH_BUILD_VERSION: ${{ needs.preflight.outputs.version }}
      npm_config_arch: ${{ matrix.arch }}
      npm_config_target_arch: ${{ matrix.arch }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache Yarn, Electron downloads and builder tools
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~\AppData\Local\Yarn\Cache
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: windows-${{ matrix.arch }}-build-cache-${{ hashFiles('yarn.lock', 'app/yarn.lock') }}
          restore-keys: windows-${{ matrix.arch }}-build-cache-

      - name: Set up Rust target and node-gyp
        shell: powershell
        run: |
          rustup target add "${{ matrix.rust-target }}"
          npm install --global yarn@${env:YARN_VERSION} node-gyp@12.3.0
          $globalPrefix = npm prefix -g
          "npm_config_node_gyp=$globalPrefix\node_modules\node-gyp\bin\node-gyp.js" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download and verify Visual C++ Redistributable
        shell: powershell
        run: |
          Invoke-WebRequest -Uri '${{ matrix.vc-redist }}' -OutFile build\vc_redist.exe
          $signature = Get-AuthenticodeSignature build\vc_redist.exe
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft Corporation') {
            throw "Visual C++ Redistributable signature validation failed: $($signature.Status)"
          }

      - name: Install dependencies
        shell: powershell
        run: yarn --frozen-lockfile --network-timeout 1000000

      - name: Build source
        shell: powershell
        run: yarn run build

      - name: Build unsigned NSIS installer
        shell: powershell
        run: node scripts/build-windows.mjs

      - name: Verify Windows package
        shell: powershell
        run: |
          $version = (Get-Content app\package.json -Raw | ConvertFrom-Json).version
          $installer = Get-Item "dist\issh-$version-setup-${{ matrix.arch }}.exe"
          if ($installer.Length -le 0) { throw 'Installer is empty' }

          $unpackedExe = Get-ChildItem dist -Directory -Filter '*-unpacked' |
            ForEach-Object { Join-Path $_.FullName 'issh.exe' } |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1
          if (-not $unpackedExe) { throw 'Packaged issh.exe was not found' }
          $bytes = [System.IO.File]::ReadAllBytes($unpackedExe)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4).ToString('X4')
          if ($machine -ne '${{ matrix.pe-machine }}') { throw "Unexpected PE machine $machine" }

          $runtimeVersion = (Get-Content (Join-Path (Split-Path $unpackedExe) 'version') -Raw).Trim()
          if ($runtimeVersion -ne '43.2.0') { throw "Unexpected Electron version $runtimeVersion" }

          $metadata = Get-Content dist\latest.yml -Raw
          if ($metadata -notmatch [regex]::Escape($installer.Name)) { throw 'latest.yml does not reference the installer' }
          if ($metadata -notmatch "version:\s*$([regex]::Escape($version))") { throw 'latest.yml version mismatch' }

          New-Item -ItemType Directory -Path "artifacts\windows-${{ matrix.arch }}" | Out-Null
          Copy-Item $installer.FullName "artifacts\windows-${{ matrix.arch }}\"
          Copy-Item dist\latest.yml "artifacts\windows-${{ matrix.arch }}\latest-windows-${{ matrix.arch }}.yml"
          $hash = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -NoNewline "artifacts\windows-${{ matrix.arch }}\$($installer.Name).sha256"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: issh-windows-${{ matrix.arch }}
          path: artifacts/windows-${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 30

  linux:
    name: Linux ${{ matrix.arch }}
    needs: preflight
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            rust-target: x86_64-unknown-linux-gnu
            elf-machine: 'Advanced Micro Devices X86-64'
          - arch: arm64
            runner: ubuntu-24.04-arm
            rust-target: aarch64-unknown-linux-gnu
            elf-machine: 'AArch64'
    env:
      ARCH: ${{ matrix.arch }}
      ISSH_BUILD_VERSION: ${{ needs.preflight.outputs.version }}
      npm_config_arch: ${{ matrix.arch }}
      npm_config_target_arch: ${{ matrix.arch }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache Yarn, Electron downloads and builder tools
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cache/yarn
            ~/.cache/electron
            ~/.cache/electron-builder
          key: linux-${{ matrix.arch }}-build-cache-${{ hashFiles('yarn.lock', 'app/yarn.lock') }}
          restore-keys: linux-${{ matrix.arch }}-build-cache-

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libsecret-1-dev libarchive-tools file
          npm install --global yarn@${YARN_VERSION} node-gyp@12.3.0
          rustup target add '${{ matrix.rust-target }}'

      - name: Install dependencies
        run: yarn --frozen-lockfile --network-timeout 1000000

      - name: Build source
        run: yarn run build

      - name: Build AppImage and tarball
        run: node scripts/build-linux.mjs

      - name: Verify Linux packages
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./app/package.json').version")"
          appimage="dist/issh-${version}-linux-${{ matrix.arch }}.AppImage"
          tarball="dist/issh-${version}-linux-${{ matrix.arch }}.tar.gz"
          test -s "$appimage"
          test -s "$tarball"

          unpacked_exe="$(find dist -maxdepth 3 -type f -path '*-unpacked/issh' -print -quit)"
          test -n "$unpacked_exe"
          readelf -h "$unpacked_exe" | grep -F 'Machine:' | grep -F '${{ matrix.elf-machine }}'
          test "$(cat "$(dirname "$unpacked_exe")/version")" = '43.2.0'

          chmod +x "$appimage"
          rm -rf squashfs-root
          "$appimage" --appimage-extract >/dev/null
          test -x squashfs-root/issh
          test -f squashfs-root/resources/app.asar

          tar -tzf "$tarball" > tar-contents.txt
          grep -E '(^|/)issh$' tar-contents.txt >/dev/null
          grep -E '(^|/)resources/app\.asar$' tar-contents.txt >/dev/null

          output="artifacts/linux-${{ matrix.arch }}"
          mkdir -p "$output"
          cp "$appimage" "$tarball" "$output/"
          (
            cd "$output"
            for package in *; do
              sha256sum "$package" > "$package.sha256"
            done
          )
        working-directory: .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: issh-linux-${{ matrix.arch }}
          path: artifacts/linux-${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - windows
      - linux
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: issh-*
          path: release-assets
          merge-multiple: true

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t assets < <(find release-assets -maxdepth 1 -type f \( -name '*.exe' -o -name '*.AppImage' -o -name '*.tar.gz' -o -name '*.sha256' \) | sort)
          if [[ ${#assets[@]} -ne 12 ]]; then
            printf 'Expected 12 release assets, found %s:\n' "${#assets[@]}" >&2
            printf '  %s\n' "${assets[@]}" >&2
            exit 1
          fi
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${assets[@]}" --repo "${GITHUB_REPOSITORY}" --verify-tag --generate-notes --title "${GITHUB_REF_NAME}"
          fi
