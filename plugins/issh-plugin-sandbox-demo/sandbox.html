<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>沙箱演示</title>
<style>
    body { margin: 0; font-family: system-ui, sans-serif; font-size: 12px; color: #dce3f0; background: transparent; padding: 10px 14px; }
    .row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
    input { padding: 4px 8px; border: 1px solid #39415a; border-radius: 4px; background: #1a2030; color: #dce3f0; font-size: 12px; }
    button { padding: 4px 12px; border: 1px solid #39415a; border-radius: 4px; background: #26304a; color: #dce3f0; cursor: pointer; font-size: 12px; }
    button:hover { background: #324062; }
    #status { color: #8b93a7; }
    #value { color: #409cff; word-break: break-all; }
</style>
</head>
<body>
    <div class="row">
        <label for="key">key</label>
        <input id="key" value="demo-key" />
        <label for="val">value</label>
        <input id="val" value="hello sandbox" />
        <button id="set">写入</button>
        <button id="get">读取</button>
        <button id="del">删除</button>
    </div>
    <div class="row">
        <span id="status">就绪（沙箱内运行，无 Tauri IPC 权限）</span>
    </div>
    <div class="row">
        <span>storage 值：</span><span id="value">—</span>
    </div>
    <div class="row">
        <button id="readTerm">读终端（最近 5 行）</button>
        <button id="writeTerm">写入终端</button>
        <span id="termStatus"></span>
    </div>
    <div class="row">
        <button id="toggleFav">切换首个主机收藏</button>
        <span id="profStatus"></span>
    </div>
    <div class="row">
        <span>终端事件：</span><span id="termData">（未收到）</span>
    </div>
<script>
    const RPC_CHANNEL = 'issh-plugin-rpc'
    const EVENT_CHANNEL = 'issh-plugin-event'
    // 面板通道 token：宿主拼在 URL hash 中下发，RPC 消息必须携带
    const CHANNEL_TOKEN = (location.hash.match(/issh-channel=([0-9a-f]+)/) || [])[1] || ''
    let rpcId = 0
    const pending = new Map()

    function rpc (method, params) {
        return new Promise((resolve, reject) => {
            const id = 'sb-' + (++rpcId)
            const timer = setTimeout(() => {
                pending.delete(id)
                reject(new Error('RPC 超时'))
            }, 5000)
            pending.set(id, { resolve, reject, timer })
            window.parent.postMessage({ channel: RPC_CHANNEL, id, method, params, token: CHANNEL_TOKEN }, '*')
        })
    }

    window.addEventListener('message', (event) => {
        const data = event.data
        if (!data || data.channel !== RPC_CHANNEL) return
        const entry = pending.get(data.id)
        if (!entry) return
        pending.delete(data.id)
        clearTimeout(entry.timer)
        if (data.ok) entry.resolve(data.result)
        else entry.reject(new Error(data.error || 'RPC 失败'))
    })

    window.addEventListener('message', (event) => {
        const data = event.data
        if (!data || data.channel !== EVENT_CHANNEL) return
        if (data.event === 'terminal.data') {
            const text = new TextDecoder().decode(new Uint8Array(data.params.data || []))
            const sessionId = data.params.sessionId || ''
            const shortId = sessionId ? sessionId.slice(0, 8) : '????????'
            const display = text.length > 50 ? text.slice(0, 50) + '…' : text
            document.getElementById('termData').textContent = `[${shortId}] ${display || '（空输出）'}`
        }
    })

    const statusEl = document.getElementById('status')
    const valueEl = document.getElementById('value')
    const keyEl = document.getElementById('key')
    const valEl = document.getElementById('val')

    document.getElementById('set').addEventListener('click', async () => {
        try {
            await rpc('storage.set', { key: keyEl.value, value: valEl.value })
            statusEl.textContent = '已写入 ' + keyEl.value
        } catch (cause) {
            statusEl.textContent = '写入失败：' + cause.message
        }
    })

    document.getElementById('get').addEventListener('click', async () => {
        try {
            const result = await rpc('storage.get', { key: keyEl.value })
            valueEl.textContent = result === null ? '（null）' : String(result)
            statusEl.textContent = '已读取 ' + keyEl.value
        } catch (cause) {
            statusEl.textContent = '读取失败：' + cause.message
        }
    })

    document.getElementById('del').addEventListener('click', async () => {
        try {
            await rpc('storage.delete', { key: keyEl.value })
            valueEl.textContent = '—'
            statusEl.textContent = '已删除 ' + keyEl.value
        } catch (cause) {
            statusEl.textContent = '删除失败：' + cause.message
        }
    })

    document.getElementById('readTerm').addEventListener('click', async () => {
        try {
            const result = await rpc('terminal.read', { lines: 5 })
            const lines = result && result.lines ? result.lines : []
            document.getElementById('termStatus').textContent = '会话 ' + (result.title || '') + '：' + lines.length + ' 行'
        } catch (cause) {
            document.getElementById('termStatus').textContent = '读取失败：' + cause.message
        }
    })

    document.getElementById('writeTerm').addEventListener('click', async () => {
        try {
            await rpc('terminal.write', { data: 'echo hello-from-sandbox\n' })
            document.getElementById('termStatus').textContent = '已写入 echo hello-from-sandbox'
        } catch (cause) {
            document.getElementById('termStatus').textContent = '写入失败：' + cause.message
        }
    })

    document.getElementById('toggleFav').addEventListener('click', async () => {
        try {
            const list = await rpc('profiles.list', {})
            const first = list && list.profiles && list.profiles[0]
            if (!first) {
                document.getElementById('profStatus').textContent = '无主机可操作'
                return
            }
            const result = await rpc('profiles.write', { id: first.id, favorite: !first.favorite })
            document.getElementById('profStatus').textContent = result && result.updated
                ? '已更新（宿主确认后）'
                : '无变更'
        } catch (cause) {
            document.getElementById('profStatus').textContent = '失败：' + cause.message
        }
    })
</script>
</body>
</html>
